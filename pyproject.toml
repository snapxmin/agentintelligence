[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentintelligence"
version = "0.1.0"
description = "A coding agent powered by Aliyun Bailian GLM models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "agentintelligence contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agentintelligence = "agentintelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
